name: Publish Packages

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # push version commits/tags and create GitHub releases
  pull-requests: write # open/update the "Version Packages" PR
  id-token: write # mint the OIDC token used for npm trusted publishing

jobs:
  release:
    if: github.repository == 'interledger/open-payments-node'
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ./.github/workflows/env-setup
      - name: Create Release Pull Request/Publish to npm
        uses: changesets/action@v1
        with:
          version: pnpm ci:version
          publish: pnpm ci:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN: npm authenticates via OIDC trusted publishing and
          # attaches provenance automatically.
