name: "Environment Setup"
description: "Sets node version, init pnpm, restore cache"

runs:
  using: "composite"
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version-file: '.nvmrc'
        cache: 'pnpm'
    - name: Install dependencies
      shell: bash
      run: pnpm install
